amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    scan_topic: scan

    min_particles: 500
    max_particles: 2000

    laser_model_type: "likelihood_field"
    max_beams: 60

    update_min_d: 0.25
    update_min_a: 0.2

    transform_tolerance: 1.0


bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    
    bt_loop_duration: 10
    default_server_timeout: 20



controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.20


    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.26
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      max_vel_theta: 1.0

      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2

      vx_samples: 20
      vtheta_samples: 20

      sim_time: 1.7

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true

      critics:
        - Oscillation
        - BaseObstacle
        - PathAlign
        - GoalAlign
        - PathDist
        - GoalDist
        - RotateToGoal

      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


planner_server:
  ros__parameters:
    use_sim_time: True

    planner_plugins: ["GridBased"]

    GridBased:
      # 2026-05-30 修改：ROS2 Jazzy 下插件类名需要使用 C++ 命名空间写法，否则 planner_server 无法加载全局规划器。
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.22

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: True
          clearing: True

          obstacle_max_range: 2.5
          raytrace_max_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 1.0
      publish_frequency: 1.0

      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05

      robot_radius: 0.22

      track_unknown_space: false
      always_send_full_costmap: True

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: True
          clearing: True

          obstacle_max_range: 2.5
          raytrace_max_range: 3.0


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True

    node_names:
      - map_server
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
